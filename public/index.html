<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Market · LeeLapYuen</title>
<meta name="description" content="What you don’t need, someone does — campus secondhand marketplace">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <a class="brand" href="#/" data-link>
      <span class="brand-mark">CM</span>
      <span class="brand-text">Campus Market</span>
    </a>

    <button type="button" class="btn-ghost sidebar-toggle" id="sidebar-toggle" aria-label="Open navigation">☰</button>

    <form class="search" id="search-form" role="search">
      <input type="search" id="search-input" name="search" placeholder="Search items…" autocomplete="off" aria-label="Search items">
      <button type="submit" aria-label="Search">Search</button>
    </form>

    <nav class="topnav" id="topnav">
      <!-- 初始都标 hidden，交给 syncNav() 按登录状态显示，避免首屏闪一下错误的状态 -->
      <a href="#/login" data-link class="btn-ghost" data-guest-only hidden>Log in</a>
      <div class="userchip" id="userchip" hidden>
        <span id="userchip-name"></span>
        <button type="button" id="logout-btn" class="btn-ghost">Log out</button>
      </div>
    </nav>
  </header>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-user" id="sidebar-user" hidden>
      <span id="sidebar-avatar"></span>
      <div style="min-width:0">
        <a id="sidebar-name" href="#/account" data-link></a>
        <div id="sidebar-email" class="s"></div>
      </div>
    </div>

    <div class="sidebar-section">Browse</div>
    <nav class="sidebar-nav">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/publish" data-link data-auth-only data-nav="publish" hidden>New listing</a>

      <div class="sidebar-section" data-auth-only hidden>My account</div>
      <a href="#/my-products" data-link data-auth-only data-nav="my-products" hidden>My listings</a>
      <a href="#/cart" data-link data-auth-only data-nav="cart" hidden>
        Cart<span class="badge" id="cart-badge" hidden>0</span>
      </a>
      <a href="#/orders" data-link data-auth-only data-nav="orders" hidden>Orders</a>
      <a href="#/account" data-link data-auth-only data-nav="account" hidden>Account settings</a>

      <div class="sidebar-section" data-admin-only hidden>Admin</div>
      <a href="#/admin" data-link data-admin-only data-nav="admin" hidden>Admin</a>

      <div class="sidebar-section" data-guest-only hidden>Account</div>
      <a href="#/login" data-link data-guest-only data-nav="login" hidden>Log in</a>
      <a href="#/register" data-link data-guest-only data-nav="register" hidden>Sign up</a>
    </nav>
  </aside>

  <!-- 主体 -->
  <main id="app" aria-live="polite">
    <div class="loading">Loading…</div>
  </main>

  <!-- 全局提示 -->
  <div id="toast" class="toast" hidden></div>

  <script src="/assets/app.js"></script>
</body>
</html>
